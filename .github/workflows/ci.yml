name: CI

on:
  push:
  pull_request:

jobs:
  backend-testleri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Testleri calistir
        # Testler gecici SQLite kullanir, PostgreSQL gerekmez (bkz. tests/conftest.py)
        run: python -m pytest -q

  web-sitesi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tip kontrolu
        run: npm run lint
      - name: Derleme
        run: npm run build

  yayin-kurulumu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Docker kurulumunu uctan uca dene
        run: bash deploy/duman_testi.sh
